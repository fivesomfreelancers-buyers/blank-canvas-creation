# Netlify hosting configuration.
#
# The build output is dist/ and every unknown path falls back to index.html so
# React Router can handle direct URL access and browser refresh on nested
# routes (/explore, /docs/so, /gig/<slug>, /freelancer/<username>, /admin/...).
#
# Static files that exist in dist/ (sitemap.xml, robots.txt, ads.txt, images,
# hashed assets) are served before this rule, so their content types stay
# correct — the sitemap remains XML, never HTML.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Per-page head metadata for public gig pages and freelancer profiles. The edge
# function rewrites title/description/canonical and the share image of the served
# HTML so each gig advertises the freelancer's own uploaded photo, not the
# site-wide image (see netlify/edge-functions/seo-meta.ts).
[[edge_functions]]
  function = "seo-meta"
  path = "/gig/*"

[[edge_functions]]
  function = "seo-meta"
  path = "/freelancer/*"
