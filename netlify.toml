# Netlify hosting configuration.
#
# The build output is dist/ and every unknown path falls back to index.html so
# React Router can handle direct URL access and browser refresh on nested
# routes (/explore, /docs/so, /gig/<slug>, /freelancer/<username>, /admin/...).
#
# Static files that exist in dist/ (sitemap.xml, robots.txt, ads.txt, images,
# hashed assets) are served before this rule, so their content types stay
# correct — the sitemap remains XML, never HTML.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
